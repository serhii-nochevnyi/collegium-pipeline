[project]
name = "collegium-pipeline"
version = "0.1.0"
description = "Deterministic Collegium delivery coordination"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.6"]

[project.scripts]
collegium-pipeline = "collegium_pipeline.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collegium_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
