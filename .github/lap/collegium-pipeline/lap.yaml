      "name": "claude-code-subscription",
      "description": "Owner's private Claude subscription; never the shared gateway"
    }
  ],
  "connections": [
    {
      "name": "pipeline-github",
      "description": "GitHub MCP; read-only tools to be enabled only after authenticated discovery",
      "url": "https://api.githubcopilot.com/mcp/readonly"
    },
    {
      "name": "atlassian-rovo",
      "description": "Atlassian Rovo (Jira, Confluence); read-only tools to be enabled only after authenticated discovery",
      "url": "https://mcp.atlassian.com/v2/mcp"
    },
    {
      "name": "ak-prod",
      "description": "Agents Knowledge (PROD); read-only tools to be enabled only after authenticated discovery",
      "url": "https://agents-knowledge.infrateam.xyz/mcp"
    },
    {
      "name": "grafana-prod",
      "description": "Grafana (PROD); read-only tools to be enabled only after authenticated discovery",
      "url": "https://toolhive.infrateam.xyz/grafana-prod/mcp"
    },
    {
      "name": "grafana-dev",
      "description": "Grafana (DEV); read-only tools to be enabled only after authenticated discovery",
      "url": "https://toolhive.infrateam-dev.xyz/grafana/mcp"
    },
