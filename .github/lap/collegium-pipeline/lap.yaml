  "secrets": [
    {
      "name": "PIPELINE_CONTROL_KEY",
      "delivery": "env",
      "description": "Project-scoped Collegium API key for the controller; separate from the Claude key"
    }
  ],
  "automations": [
    {
      "name": "pipeline-controller",
      "start": "paused",
      "schedule": "*/5 * * * *",
      "notify": "failures",
      "script": {
        "files": [
          "controller/src/collegium_pipeline/__init__.py",
          "controller/src/collegium_pipeline/__main__.py",
          "controller/src/collegium_pipeline/adapters.py",
          "controller/src/collegium_pipeline/artifacts.py",
          "controller/src/collegium_pipeline/broker.py",
          "controller/src/collegium_pipeline/ci.py",
          "controller/src/collegium_pipeline/cli.py",
          "controller/src/collegium_pipeline/config.py",
          "controller/src/collegium_pipeline/controller.py",
          "controller/src/collegium_pipeline/credentials.py",
          "controller/src/collegium_pipeline/delivery.py",
          "controller/src/collegium_pipeline/delivery_workers.py",
          "controller/src/collegium_pipeline/doctor.py",
          "controller/src/collegium_pipeline/domain.py",
          "controller/src/collegium_pipeline/effort.py",
          "controller/src/collegium_pipeline/native_broker.py",
          "controller/src/collegium_pipeline/packets.py",
          "controller/src/collegium_pipeline/platform.py",
          "controller/src/collegium_pipeline/quality.py",
          "controller/src/collegium_pipeline/readiness.py",
          "controller/src/collegium_pipeline/runner.py",
          "controller/src/collegium_pipeline/service_test.py",
          "controller/src/collegium_pipeline/store.py",
          "controller/src/collegium_pipeline/transport.py",
          "controller/entry.py",
          "controller/settings.json",
          "controller/integrations.json"
        ],
        "command": "python3 controller/entry.py",
        "executor": "aranarium",
        "environment_ref": "custom",
        "environment": "base",
        "size": "small",
        "secrets": [
          "PIPELINE_CONTROL_KEY"
        ]
      }
    },
    {
      "name": "pipeline-native-broker-1474663859-v1",
      "start": "paused",
      "schedule": "0 0 1 1 *",
      "notify": "none",
      "script": {
        "files": [
          "native_github_broker.py",
          "broker_scope.json"
        ],
        "command": "python3 native_github_broker.py",
        "executor": "aranarium",
        "environment_ref": "custom",
        "environment": "base",
        "size": "small",
        "repositories": [
          {
            "url": "https://github.com/serhii-nochevnyi/collegium-pipeline",
            "connection": "ghc_7de07519a1e3437a95f98edc4545022d",
            "access": "contributor"
          }
        ]
      }
