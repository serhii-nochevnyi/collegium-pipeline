      "name": "pipeline-quality",
      "file": "rules/quality.md"
    }
  ],
  "model_connections": [
    {
      "name": "claude-code-subscription",
      "description": "Owner's private Claude subscription; never the shared gateway"
    }
  ],
  "connections": [
    {
      "name": "atlassian-rovo",
      "description": "Atlassian Rovo (Jira, Confluence); explicit read-only tool ceiling; connected",
      "url": "https://mcp.atlassian.com/v2/mcp",
      "tools": [
        "getAccessibleAtlassianResources",
        "atlassianUserInfo",
        "getConfluenceContent",
        "searchConfluence",
        "getJiraIssue",
        "listJiraIssueComments",
        "searchJiraIssuesUsingJql",
        "search"
      ]
    },
    {
      "name": "ak-prod",
      "description": "Agents Knowledge (PROD); explicit read-only tool ceiling; connected",
      "url": "https://agents-knowledge.infrateam.xyz/mcp",
      "tools": [
        "search_docs",
        "get_document",
        "list_workspaces",
        "list_collections",
        "get_document_tree",
        "get_related_documents"
      ]
    },
    {
      "name": "grafana-prod",
      "description": "Grafana (PROD); explicit read-only tool ceiling; connected",
      "url": "https://toolhive.infrateam.xyz/grafana-prod/mcp",
      "tools": [
        "alerting_rules_read",
        "alerting_silences_read",
        "analyze_loki_labels",
        "check_datasources_health",
        "diff_tempo_traces",
        "get_annotation_tags",
        "get_annotations",
        "get_dashboard_by_uid",
        "get_dashboard_panel_queries",
        "get_dashboard_property",
        "get_dashboard_summary",
        "get_datasource",
        "get_doc",
        "get_tempo_trace",
        "get_tempo_traceql_docs",
        "list_dashboard_versions",
        "list_datasources",
        "list_loki_label_names",
        "list_loki_label_values",
        "list_prometheus_label_names",
        "list_prometheus_label_values",
        "list_prometheus_metric_metadata",
        "list_prometheus_metric_names",
        "list_pyroscope_label_names",
        "list_pyroscope_label_values",
        "list_pyroscope_profile_types",
        "list_tempo_attribute_names",
        "list_tempo_attribute_values",
        "query_loki_logs",
        "query_loki_patterns",
        "query_loki_stats",
        "query_prometheus",
        "query_prometheus_histogram",
        "query_pyroscope",
        "query_tempo_metrics",
        "search_dashboards",
        "search_folders",
        "search_tempo_traces"
      ]
    },
    {
      "name": "vmcluster-prod",
      "description": "VictoriaMetrics (PROD); explicit read-only tool ceiling; connected",
      "url": "https://toolhive.infrateam.xyz/vmcluster-prod/mcp",
      "tools": [
        "active_queries",
        "alerts",
        "documentation",
        "explain_query",
        "label_values",
        "labels",
        "metric_statistics",
        "metrics",
        "metrics_metadata",
        "prettify_query",
        "query",
        "query_range",
        "rules",
        "series",
        "top_queries",
        "tsdb_status"
      ]
    },
    {
      "name": "backstage-prod",
      "description": "Backstage (PROD); explicit read-only tool ceiling; connected",
      "url": "https://toolhive.infrateam.xyz/backstage-prod/mcp",
      "tools": [
        "get-catalog-entity",
        "validate-entity"
      ]
    },
    {
      "name": "ak-dev",
      "description": "Agents Knowledge (DEV); explicit read-only tool ceiling; connected",
      "url": "https://agents-knowledge.infrateam-dev.xyz/mcp",
      "tools": [
        "search_docs",
        "get_document",
        "list_workspaces",
        "list_collections",
        "get_document_tree",
        "get_related_documents"
      ]
    }
  ],
  "secrets": [
    {
      "name": "PIPELINE_CONTROL_KEY",
      "delivery": "env",
      "description": "Separate space-limited Collegium API key for the controller; separate from the Claude key"
    }
  ],
  "automations": [
    {
      "name": "pipeline-controller",
      "start": "paused",
      "schedule": "*/5 * * * *",
      "notify": "failures",
      "script": {
        "files": [
          "controller/runtime.b64",
          "controller/entry.py",
          "controller/settings.json",
          "controller/epic-settings.json",
          "controller/integrations.json"
        ],
        "command": "python3 controller/entry.py",
        "executor": "aranarium",
        "environment_ref": "custom",
        "environment": "base",
        "size": "small",
        "secrets": [
          "PIPELINE_CONTROL_KEY"
        ],
        "mcp_servers": [
          "atlassian-rovo"
        ]
      }
    },
    {
      "name": "pipeline-native-broker-1474663859-v1",
      "start": "paused",
      "schedule": "0 0 1 1 *",
      "notify": "none",
      "script": {
        "files": [
          "native_github_broker.py",
          "broker_scope.json"
        ],
        "command": "python3 native_github_broker.py",
        "executor": "aranarium",
        "environment_ref": "custom",
        "environment": "base",
        "size": "small",
        "repositories": [
          {
            "url": "https://github.com/serhii-nochevnyi/collegium-pipeline",
            "connection": "ghc_7de07519a1e3437a95f98edc4545022d",
            "access": "contributor"
          }
        ]
      }
    },
    {
      "name": "pipeline-recovery-store-v1",
      "start": "paused",
      "schedule": "0 0 1 1 *",
      "notify": "none",
      "script": {
        "files": [
          "recovery_store.py",
          "recovery_scope.json"
        ],
        "command": "python3 recovery_store.py",
        "executor": "aranarium",
        "environment_ref": "custom",
        "environment": "base",
        "size": "small",
        "secrets": [
          "PIPELINE_CONTROL_KEY"
        ]
      }
    }
  ]
}
